name: Release

# Publishes the package and docs to Hex when a v* tag is pushed, or on manual
# dispatch. Requires a HEX_API_KEY repository secret (Settings -> Secrets and
# variables -> Actions). Generate one with `mix hex.user key generate`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: Publish
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
